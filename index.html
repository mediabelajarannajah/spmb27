<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSB 2027/2028</title>
<style>
:root{--g:#0f766e;--g2:#0d5c56;--bg:#f6f8f7;--t:#1f2937;--m:#6b7280;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
a{color:var(--g)}header{background:var(--g);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;margin-left:16px;font-size:14px}header b{font-size:16px}
.wrap{max-width:1000px;margin:0 auto;padding:20px}.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:56px 20px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}
h2{color:var(--g);margin:28px 0 12px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ph,.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#d1e7e4;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:13px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--g2)}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}
form .f{margin-bottom:14px}label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}label i{color:#dc2626}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}.err{color:#dc2626;font-size:12px;min-height:16px}
.two{display:grid;gap:0 16px;grid-template-columns:1fr 1fr}@media(max-width:640px){.two{grid-template-columns:1fr}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:#fff;border-radius:14px;padding:28px;max-width:400px;width:100%;text-align:center}
.spin{width:44px;height:44px;border:5px solid #d1e7e4;border-top-color:var(--g);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}
.ico{font-size:46px}.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px;text-align:center}.stat b{font-size:30px;color:var(--g);display:block}
.tabs button{border:0;background:#e5e7eb;padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;margin-right:4px}.tabs .on{background:var(--g);color:#fff}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--b)}table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--b);white-space:nowrap;text-align:left}th{background:#f0f5f4;position:sticky;top:0}
footer{text-align:center;color:var(--m);padding:24px;font-size:13px}
</style></head><body>
<header><b id="hn">PSB</b><nav><a href="#">Beranda</a><a href="#admin">Admin</a></nav></header>
<main id="app"><div class="wrap">Memuat…</div></main>
<footer id="ft"></footer>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwTzeIQtJ5085TC1bFXbRrvkDlocXI4nctzQyNI9BMMfXVivxkJBsfyZ1dBzoaPq_vo/exec';   // URL Web App Apps Script
const SITE = {
  yayasan: {
    nama: 'Yayasan Pendidikan Islam ........',
    profil: 'Tulis profil singkat yayasan di sini: tahun berdiri, sejarah, lokasi, dan keunggulan lembaga.',
    visi: 'Terwujudnya generasi santri yang beriman, berilmu, dan berakhlak mulia.',
    misi: ['Menyelenggarakan pendidikan berbasis nilai-nilai Islam.', 'Mengembangkan potensi akademik dan non-akademik santri.',
           'Membangun karakter mandiri, disiplin, dan peduli.', 'Menjalin kemitraan erat dengan orang tua dan masyarakat.'],
    alamat: 'Alamat yayasan', kontak: '08xx-xxxx-xxxx'
  },
  // Taruh file foto di folder img/ pada repo GitHub
  foto: { gedung: ['img/1.jpg', 'img/gedung2.jpg'], kegiatan: ['img/kegiatan1.jpg', 'img/kegiatan2.jpg', 'img/kegiatan3.jpg', 'img/kegiatan4.jpg'] }
};
// Pengganti gsRun(): memanggil Apps Script lewat fetch (text/plain agar tanpa preflight CORS)
function gsRun() {
  let ok = () => {}, fail = () => {};
  const r = new Proxy({}, { get: (_, k) => k === 'withSuccessHandler' ? f => (ok = f, r) : k === 'withFailureHandler' ? f => (fail = f, r) :
    (...a) => { fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: k, args: a }) }).then(x => x.json()).then(ok, fail); } });
  return r;
}
let C, $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
gsRun().withSuccessHandler(c => { C = Object.assign(c, SITE); $('#hn').textContent = c.yayasan.nama; $('#ft').textContent = '© PSB ' + c.tahun + ' – ' + c.yayasan.nama; route(); })
  .withFailureHandler(e => $('#app').innerHTML = '<div class="wrap">Gagal memuat: ' + esc(e.message) + '</div>').getConfig();
addEventListener('hashchange', route);
function route() {
  const h = location.hash.slice(1).split('/'); window.scrollTo(0, 0);
  if (h[0] === 'daftar' && C.units[h[1]]) form(h[1]); else if (h[0] === 'admin') admin(); else home();
}
const pic = (u, t) => u ? '<img src="' + esc(u) + '" alt="' + t + '" loading="lazy" onerror="this.remove()">' : '<div class="ph">Foto ' + t + '</div>';

function home() {
  const y = C.yayasan;
  $('#app').innerHTML = `<div class="hero"><h1>Penerimaan Santri Baru</h1><p>Tahun Ajaran ${C.tahun}</p><p>${esc(y.nama)}</p>
  <a class="btn" style="background:#fff;color:var(--g)" href="#units">Daftar Sekarang</a></div>
  <div class="wrap">
  <h2>Profil Yayasan</h2><div class="card">${esc(y.profil)}</div>
  <div class="grid"><div class="card"><h3>Visi</h3>${esc(y.visi)}</div><div class="card"><h3>Misi</h3><ol>${y.misi.map(m => '<li>' + esc(m) + '</li>').join('')}</ol></div></div>
  <h2>Gedung Sekolah</h2><div class="grid">${C.foto.gedung.map(u => pic(u, 'Gedung')).join('')}</div>
  <h2>Kegiatan Santri</h2><div class="grid">${C.foto.kegiatan.map(u => pic(u, 'Kegiatan')).join('')}</div>
  <h2 id="units">Pilih Unit Pendaftaran</h2><div class="grid">${Object.keys(C.units).map(k =>
    `<div class="card" style="text-align:center"><h3>${esc(C.units[k].nama)}</h3><p>Pendaftaran santri baru ${C.tahun}</p><a class="btn" href="#daftar/${k}">Daftar ${k}</a></div>`).join('')}</div>
  <div class="card">📍 ${esc(y.alamat)} &nbsp; 📞 ${esc(y.kontak)}</div></div>`;
}

function field(f) {
  const r = f.required ? ' <i>*</i>' : '', n = 'name="' + f.name + '" id="f_' + f.name + '"';
  let el;
  if (f.type === 'select') el = `<select ${n}><option value="">-- pilih --</option>${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') el = `<textarea ${n} rows="3"></textarea>`;
  else el = `<input ${n} type="${f.type === 'tel' ? 'tel' : f.type}" ${f.digits ? 'inputmode="numeric" maxlength="' + f.digits + '"' : ''}>`;
  return `<div class="f"><label>${esc(f.label)}${r}</label>${el}<div class="err" id="e_${f.name}"></div></div>`;
}

function form(u) {
  const U = C.units[u];
  $('#app').innerHTML = `<div class="wrap"><a href="#">← Kembali</a><h2>Formulir Pendaftaran ${esc(U.nama)} – ${C.tahun}</h2>
  <form class="card" id="fm" novalidate><div class="two">${U.fields.map(field).join('')}</div>
  <button class="btn" type="submit">Kirim Pendaftaran</button></form></div>`;
  $('#fm').onsubmit = e => {
    e.preventDefault(); let ok = true, d = {};
    U.fields.forEach(f => {
      const v = $('#f_' + f.name).value.trim(); d[f.name] = v; let m = '';
      if (f.required && !v) m = 'Wajib diisi';
      else if (f.digits && v && !new RegExp('^\\d{' + f.digits + '}$').test(v)) m = 'Harus ' + f.digits + ' digit angka';
      else if (f.type === 'tel' && v && !/^(\+62|62|0)8\d{7,12}$/.test(v.replace(/[\s-]/g, ''))) m = 'Nomor HP tidak valid';
      $('#e_' + f.name).textContent = m; if (m) ok = false;
    });
    if (!ok) return modal('<div class="ico">⚠️</div><h3>Data belum lengkap</h3><p>Periksa isian yang bertanda merah.</p>' + close());
    modal('<div class="spin"></div><h3>Mengirim data…</h3><p>Mohon tunggu, jangan tutup halaman.</p>');
    gsRun().withSuccessHandler(r => {
      if (r.ok) { $('#fm').reset(); success(u, r); }
      else modal('<div class="ico">❌</div><h3>Gagal</h3><p>' + esc(r.msg) + '</p>' + close());
    }).withFailureHandler(e => modal('<div class="ico">❌</div><h3>Gagal terkirim</h3><p>' + esc(e.message) + '</p>' + close())).submitForm(u, d);
  };
}
function success(u, r) {
  let t = 10;
  const wa = r.wa ? '<a class="btn" href="' + esc(r.wa) + '">Gabung Grup WhatsApp ' + esc(u) + '</a><p id="cd" style="font-size:13px">Otomatis diarahkan dalam 10 detik…</p>' : close();
  modal('<div class="ico">✅</div><h3>Berhasil!</h3><p>' + esc(r.msg) + '<br>Nomor pendaftaran:<br><b style="font-size:20px">' + esc(r.noReg) + '</b></p>' + wa);
  if (r.wa) { const iv = setInterval(() => { if (--t <= 0) { clearInterval(iv); location.href = r.wa; } else $('#cd').textContent = 'Otomatis diarahkan dalam ' + t + ' detik…'; }, 1000); }
}
const close = () => '<button class="btn" onclick="$(\'#modal\').style.display=\'none\'">Tutup</button>';
function modal(h) { $('#mbox').innerHTML = h; $('#modal').style.display = 'flex'; }

function admin() {
  $('#app').innerHTML = `<div class="wrap"><h2>Dashboard Admin</h2><form class="card" id="lg" style="max-width:420px">
  <div class="f"><label>Cakupan</label><select id="sc"><option value="ALL">Semua Unit (Yayasan)</option>${Object.keys(C.units).map(k => `<option>${k}</option>`).join('')}</select></div>
  <div class="f"><label>Password</label><input type="password" id="pw"></div><button class="btn">Masuk</button></form><div id="dash"></div></div>`;
  $('#lg').onsubmit = e => {
    e.preventDefault(); modal('<div class="spin"></div><h3>Memuat data…</h3>');
    gsRun().withSuccessHandler(r => {
      if (!r.ok) return modal('<div class="ico">❌</div><h3>' + esc(r.msg) + '</h3>' + close());
      $('#modal').style.display = 'none'; $('#lg').style.display = 'none'; dash(r.data);
    }).withFailureHandler(e => modal('<div class="ico">❌</div><p>' + esc(e.message) + '</p>' + close())).adminData($('#sc').value, $('#pw').value);
  };
}

function dash(D) {
  const ks = Object.keys(D), tot = ks.reduce((a, k) => a + D[k].rows.length, 0);
  const L = (n, t) => `<div class="stat"><b>${n}</b>${t}</div>`;
  $('#dash').innerHTML = `<div class="stats">${ks.length > 1 ? L(tot, 'Total Pendaftar') : ''}${ks.map(k => L(D[k].rows.length, 'Pendaftar ' + k)).join('')}</div>
  <div class="tabs" style="margin-top:20px">${ks.map((k, i) => `<button data-k="${k}" class="${i ? '' : 'on'}">${k}</button>`).join('')}</div>
  <div style="margin:10px 0"><input id="q" placeholder="Cari nama / NIK / apa saja…" style="max-width:320px"> <button class="btn o" id="ex">Unduh CSV</button></div>
  <div class="tw" id="tb"></div>`;
  let cur = ks[0];
  const draw = () => {
    const q = $('#q').value.toLowerCase(), d = D[cur], rows = d.rows.filter(r => !q || r.join(' ').toLowerCase().includes(q));
    $('#tb').innerHTML = '<table><tr>' + d.headers.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>' +
      rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>' + (rows.length ? '' : '<p style="padding:12px">Belum ada data.</p>');
  };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { cur = b.dataset.k; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#q').oninput = draw;
  $('#ex').onclick = () => {
    const d = D[cur], csv = [d.headers].concat(d.rows).map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'pendaftar-' + cur + '.csv'; a.click();
  };
  draw();
}
</script></body></html>
